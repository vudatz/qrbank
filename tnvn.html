<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Portal - vudatz</title>
    <!-- Nhúng thư viện FontAwesome để lấy icon Facebook -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Khung chứa web gốc chiếm toàn bộ phần trên */
        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Nút Facebook nhỏ nổi ở góc dưới bên phải */
        .fb-btn {
            position: fixed;
            bottom: 45px;
            right: 20px;
            background-color: #1877F2;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            font-size: 20px;
            transition: transform 0.2s ease;
            z-index: 9999;
        }

        .fb-btn:hover {
            transform: scale(1.1);
            background-color: #145dbf;
        }

        /* Chân trang bên dưới cùng */
        footer {
            height: 32px;
            background-color: #1a1a1a;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe src="https://otp-tnvn.vivas.vn"></iframe>
    </div>

    <!-- Icon FB trỏ về link của mày -->
    <a href="https://facebook.com/vudatz" target="_blank" class="fb-btn" title="Facebook vudatz">
        <i class="fa-brands fa-facebook-f"></i>
    </a>

    <!-- Chân trang -->
    <footer>
